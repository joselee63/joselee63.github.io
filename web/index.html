<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>한국 증시 섹터 차트</title>
<style>
:root{
  --bg:#ffffff; --fg:#1d2127; --muted:#6b7280; --line:#e5e7eb; --soft:#f5f6f8; --card:#ffffff;
  --accent:#1f2937; --accent-fg:#ffffff;
  --up:#E5383B; --dn:#1D63D8; --ok:#16a34a; --warn:#d97706;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121417; --fg:#e7e9ec; --muted:#9aa1ab; --line:#2a2f36; --soft:#1a1d22; --card:#16191d;
         --accent:#e7e9ec; --accent-fg:#121417; --up:#ff5a5f; --dn:#4b8dff; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.45}
a{color:inherit}
.wrap{max-width:1840px;margin:0 auto;padding:0 18px 60px}

/* 상단 바 */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top{max-width:1840px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.top h1{font-size:18px;margin:0;letter-spacing:-.2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;color:var(--muted);font-size:12.5px}
.meta b{color:var(--fg);font-weight:600}
.meta .upd b{font-size:13.5px}
.tag{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.act{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;font-size:13px;cursor:pointer;border:0;border-radius:6px;
  padding:7px 14px;background:var(--accent);color:var(--accent-fg)}
.btn[disabled]{opacity:.5;cursor:default}
.lnk{font-size:12px;color:var(--muted);cursor:pointer;text-decoration:underline;background:none;border:0;padding:0;font-family:inherit}
.status{font-size:12.5px;color:var(--muted);display:none;align-items:center;gap:6px}
.status.on{display:flex}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.status.run .dot{background:var(--warn);animation:pulse 1.2s infinite}
.status.ok .dot{background:var(--ok)} .status.err .dot{background:var(--up)} .status.warn .dot{background:var(--warn)}
.status.err{color:var(--up)}
@keyframes pulse{50%{opacity:.25}}
nav.jump{max-width:1840px;margin:0 auto;padding:0 18px 8px;display:flex;gap:14px;font-size:12.5px}
nav.jump a{color:var(--muted);text-decoration:none} nav.jump a:hover{color:var(--fg)}

h2{font-size:17px;margin:26px 0 4px}
section,.csec,.cell{scroll-margin-top:calc(var(--hh,90px) + 10px)}
.sub{font-size:12px;color:var(--muted);margin:0 0 10px}
.load{padding:60px 0;text-align:center;color:var(--muted)}

/* 표 공통 */
table{border-collapse:separate;border-spacing:0;white-space:nowrap}
th,td{padding:5px 9px;border-bottom:1px solid var(--line);text-align:right}
th{font-weight:600;font-size:12.5px}
.l{text-align:left}
.d{color:var(--muted)}
.na{opacity:.4}
.b{font-size:11.5px;padding:1px 6px;border-radius:3px;white-space:nowrap;display:inline-block}
.b.up{background:rgba(229,56,59,.13);color:var(--up)} .b.dn{background:rgba(29,99,216,.13);color:var(--dn)}
.sect td,.sect th{padding:5px 12px}
.sect td.l{min-width:150px}

/* 결과표 */
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 6px}
.bar input,.bar select,.flt input{font:inherit;font-size:12.5px;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:5px;padding:5px 7px}
.bar .q{width:230px}
.bar .sec{max-width:260px}
.bar label{font-size:12.5px;display:flex;gap:4px;align-items:center}
.bar .cnt{margin-left:auto;color:var(--muted);font-size:12.5px}
.bar .cnt b{color:var(--fg)}
.hint{font-size:11.5px;color:var(--muted);margin:0 0 6px}
.tbox{max-height:640px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.tbox table{width:100%}
.tbox thead th{position:sticky;top:0;z-index:2;background:var(--card)}
.tbox thead tr.h th{cursor:pointer;user-select:none}
.tbox thead tr.f th{padding:3px 5px}
.flt input{width:62px;padding:2px 5px;display:block;margin:1px 0 1px auto}
.tbox tbody tr:hover td{background:var(--soft)}
.tbox td.e{max-width:170px;overflow:hidden;text-overflow:ellipsis}
.tbox a.nm{text-decoration:none;font-weight:600}
.tbox a.nm:hover{text-decoration:underline}

/* 차트 */
.csec{margin-top:30px;padding-top:12px;border-top:2px solid var(--line)}
.csec h3{font-size:16px;margin:0 0 2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.cell .cap{font-size:13px;margin:2px 0 4px;line-height:1.5}
.cell .cap .c{color:var(--muted)} .cell .cap .ds{color:var(--muted)}
.cell img{width:100%;height:auto;aspect-ratio:900/486;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.cell.hl img{outline:3px solid var(--warn);outline-offset:2px}
.jsel{font:inherit;font-size:12.5px;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
footer{margin-top:40px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
footer ul{margin:4px 0 10px;padding-left:18px}
@media (max-width:900px){
  header{position:static}
  .sect td.l{white-space:normal;min-width:118px;max-width:150px}
  .sect td,.sect th{padding:5px 7px}
  section,.csec,.cell{scroll-margin-top:8px}
  .grid{grid-template-columns:1fr}
  .act{margin-left:0}
  .bar .q{width:100%}
}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>한국 증시 섹터 차트</h1>
    <div class="meta" id="meta"><span>불러오는 중…</span></div>
    <div class="act">
      <span class="status" id="status"><span class="dot"></span><span id="stxt"></span></span>
      <button class="btn" id="upd" type="button">↻ 업데이트</button>
      <button class="lnk" id="tokreset" type="button" style="display:none">토큰 변경</button>
    </div>
  </div>
  <nav class="jump"><a href="#sector">섹터 강도</a><a href="#result">종목별 결과표</a><a href="#charts">섹터별 차트</a></nav>
</header>

<div class="wrap">
  <div id="loading" class="load">데이터를 불러오는 중…</div>

  <section id="sector" style="display:none">
    <h2>섹터 강도</h2>
    <p class="sub">5일 평균 등락률 순 · 섹션 이름 클릭 = 결과표에서 그 섹션만 보기 · 거래대금 = 종가×거래량 근사 · 지수·ETF 섹션 제외</p>
    <div style="overflow-x:auto"><table class="sect" id="secttbl"></table></div>
  </section>

  <section id="result" style="display:none">
    <h2>종목별 결과표</h2>
    <div class="bar">
      <input class="q" id="q" type="search" placeholder="종목·코드·설명 검색 (예: HBM)">
      <select class="sec" id="fsec"><option value="">섹션 전체</option></select>
      <select id="ftr"><option value="">추세선 전체</option><option>저항선 돌파</option><option>지지선 이탈</option><option>추세선 안</option></select>
      <label><input id="noetf" type="checkbox" checked> 지수·ETF 제외</label>
      <button class="lnk" id="freset" type="button">필터 초기화</button>
      <span class="cnt" id="cnt"></span>
    </div>
    <p class="hint">숫자 칸 아래 입력창: 위 = 최소, 아래 = 최대 (예: 5일% 최소 5, 거래량배수 최소 2) · 제목 클릭 = 정렬 · 종목명 클릭 = 차트로 이동</p>
    <div class="tbox"><table id="rtbl"><thead><tr class="h"></tr><tr class="f flt"></tr></thead><tbody></tbody></table></div>
  </section>

  <section id="charts" style="display:none">
    <h2>섹터별 차트</h2>
    <p class="sub">캔들 · 이동평균 · 자동 추세선(실선 장기 / 점선 단기) &nbsp;
      <select class="jsel" id="jump"><option value="">섹션으로 이동…</option></select></p>
    <div id="chartbox"></div>
  </section>

  <footer id="foot" style="display:none"></footer>
</div>

<script>
(function(){
  "use strict";
  var TOKEN_KEY = "krsc_gh_token";
  var COLS = [
    ["섹션","s"],["종목","s"],["코드","s"],["설명","s"],["종가","price"],
    ["1일%","pct"],["5일%","pct"],["20일%","pct"],["52주고가대비%","pct"],
    ["MA20이격%","pct"],["거래대금(억)","int"],["거래량배수","x"],["추세선","s"]
  ];
  var S = null;                 // 현재 데이터
  var sortKey = null, sortDir = -1;
  var busy = false;

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function comma(v, d){ var p = v.toFixed(d).split("."); p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ","); return p.join("."); }
  function now(){ return new Date().getTime(); }
  function pct(v, suffix){
    if (v === null || v === undefined) return '<span class="na">-</span>';
    v = Math.round(v * 100) / 100;            // -0.00 방지
    var col = v > 0 ? "var(--up)" : (v < 0 ? "var(--dn)" : "inherit");
    return '<span style="color:' + col + '">' + (v > 0 ? "+" : "") + v.toFixed(2) + (suffix || "") + "</span>";
  }
  function isNum(t){ return t !== "s"; }
  function mmss(ms){ var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

  // ---------- 데이터 로드 (data/summary.js, 캐시 우회) ----------
  function loadSummary(cb){
    var done = false;
    var sc = document.createElement("script");
    window.__krsc_summary = function(d){ done = true; cb(d); };
    sc.src = "data/summary.js?t=" + now();
    sc.onerror = function(){ if (!done) { done = true; cb(null); } };
    document.getElementsByTagName("head")[0].appendChild(sc);
    setTimeout(function(){ if (sc.parentNode) sc.parentNode.removeChild(sc); }, 20000);
  }

  // ---------- 상단 메타 ----------
  function renderMeta(){
    var m = S.meta;
    var trig = m.trigger === "schedule" ? "자동" : (m.trigger === "workflow_dispatch" ? "수동" : "로컬");
    var nf = (m.failed || []).length;
    var h = '<span class="upd">업데이트 완료 <b>' + esc(m.updated_at) + '</b> <span class="tag">' + trig + '</span></span>' +
            '<span>데이터 기준일 <b>' + esc(m.ref_date) + '</b></span>' +
            '<span>' + m.n_ok + '종목' + (nf ? ' · <a href="#foot">실패 ' + nf + '</a>' : '') + '</span>' +
            '<span>자동 업데이트 평일 21:07</span>';
    $("meta").innerHTML = h;
    document.title = "한국 증시 섹터 차트 · " + m.ref_date;
  }

  // ---------- 섹터 강도 ----------
  function renderSector(){
    var rows = S.sector_table || [];
    var h = '<thead><tr><th class="l">섹션</th><th>평균 5일%</th><th>평균 1일%</th><th>평균 20일%</th>' +
            '<th>거래대금 합(억)</th><th>MA20 위</th><th>저항 돌파</th><th>지지 이탈</th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      h += '<tr><td class="l"><a href="#" class="secgo" data-s="' + esc(r["섹션"]) + '">' + esc(r["섹션"]) + '</a></td>' +
           '<td><b>' + pct(r["평균 5일%"]) + '</b></td><td>' + pct(r["평균 1일%"]) + '</td><td>' + pct(r["평균 20일%"]) + '</td>' +
           '<td>' + (r["거래대금 합(억)"] === null ? "-" : comma(r["거래대금 합(억)"], 0)) + '</td>' +
           '<td>' + r["MA20위"] + '/' + r["종목수"] + '</td><td>' + (r["저항돌파"] || '<span class="na">0</span>') + '</td>' +
           '<td>' + (r["지지이탈"] || '<span class="na">0</span>') + '</td></tr>';
    }
    $("secttbl").innerHTML = h + "</tbody>";
  }

  // ---------- 종목별 결과표 ----------
  function buildTableHead(){
    var hr = document.querySelector("#rtbl tr.h"), fr = document.querySelector("#rtbl tr.f");
    for (var i = 0; i < COLS.length; i++) {
      var c = COLS[i];
      var th = document.createElement("th");
      th.className = isNum(c[1]) ? "" : "l";
      th.setAttribute("data-k", c[0]);
      th.innerHTML = esc(c[0]) + '<span class="ar"></span>';
      hr.appendChild(th);
      var tf = document.createElement("th");
      if (isNum(c[1])) {
        tf.innerHTML = '<input class="num" type="number" step="any" placeholder="최소" data-k="' + c[0] + '" data-m="min">' +
                       '<input class="num" type="number" step="any" placeholder="최대" data-k="' + c[0] + '" data-m="max">';
      }
      fr.appendChild(tf);
    }
    hr.addEventListener("click", function(e){
      var t = e.target;
      while (t && t !== hr && t.tagName !== "TH") t = t.parentNode;
      if (!t || t === hr) return;
      var key = t.getAttribute("data-k");
      if (sortKey === key) sortDir = -sortDir;
      else { sortKey = key; sortDir = /^(섹션|종목|코드|설명|추세선)$/.test(key) ? 1 : -1; }
      applyFilter();
    });
  }

  function setHeaderOffset(){
    document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + "px");
  }

  function stickFilterRow(){
    var h = document.querySelector("#rtbl tr.h").offsetHeight;
    var fs = document.querySelectorAll("#rtbl tr.f th");
    for (var j = 0; j < fs.length; j++) fs[j].style.top = h + "px";
  }

  function cell(c, v, r){
    var t = c[1];
    if (v === null || v === undefined || v === "") return '<td class="' + (t === "s" ? "l" : "") + '"><span class="na">-</span></td>';
    if (t === "price") return "<td>" + comma(v, r._idx ? 2 : 0) + "</td>";
    if (t === "int") return "<td>" + comma(v, 0) + "</td>";
    if (t === "x") return "<td>" + v.toFixed(1) + "</td>";
    if (t === "pct") return "<td>" + pct(v) + "</td>";
    if (c[0] === "추세선") {
      if (v === "저항선 돌파") return '<td class="l"><span class="b up">' + v + "</span></td>";
      if (v === "지지선 이탈") return '<td class="l"><span class="b dn">' + v + "</span></td>";
      return '<td class="l d">' + esc(v) + "</td>";
    }
    if (c[0] === "종목") return '<td class="l"><a class="nm" href="#c-' + esc(r["코드"]) + '">' + esc(v) + "</a></td>";
    if (c[0] === "섹션" || c[0] === "설명") return '<td class="l d e" title="' + esc(v) + '">' + esc(v) + "</td>";
    return '<td class="l d">' + esc(v) + "</td>";
  }

  function applyFilter(){
    if (!S) return;
    var DATA = S.rows;
    var text = $("q").value.replace(/^\s+|\s+$/g, "").toLowerCase();
    var sec = $("fsec").value, tr = $("ftr").value, noetf = $("noetf").checked;
    var rng = [], ins = document.querySelectorAll("#rtbl input.num"), j, k;
    for (j = 0; j < ins.length; j++) {
      if (ins[j].value !== "" && !isNaN(parseFloat(ins[j].value)))
        rng.push([ins[j].getAttribute("data-k"), ins[j].getAttribute("data-m"), parseFloat(ins[j].value)]);
    }
    var rows = [];
    for (j = 0; j < DATA.length; j++) {
      var r = DATA[j], ok = true;
      if (noetf && r._etf) continue;
      if (sec && r["섹션"] !== sec) continue;
      if (tr && r["추세선"] !== tr) continue;
      if (text && (r["종목"] + " " + r["코드"] + " " + r["설명"] + " " + r["섹션"]).toLowerCase().indexOf(text) < 0) continue;
      for (k = 0; k < rng.length; k++) {
        var v = r[rng[k][0]];
        if (v === null || v === undefined) { ok = false; break; }
        if (rng[k][1] === "min" && v < rng[k][2]) { ok = false; break; }
        if (rng[k][1] === "max" && v > rng[k][2]) { ok = false; break; }
      }
      if (ok) rows.push(r);
    }
    if (sortKey) {
      rows.sort(function(a, b){
        var x = a[sortKey], y = b[sortKey];
        if (x === null || x === undefined) return 1;
        if (y === null || y === undefined) return -1;
        if (typeof x === "string") return sortDir * x.localeCompare(y);
        return sortDir * (x - y);
      });
    }
    var out = [];
    for (j = 0; j < rows.length; j++) {
      var line = "<tr>";
      for (var m = 0; m < COLS.length; m++) line += cell(COLS[m], rows[j][COLS[m][0]], rows[j]);
      out.push(line + "</tr>");
    }
    document.querySelector("#rtbl tbody").innerHTML = out.join("");
    $("cnt").innerHTML = "표시 <b>" + rows.length + "</b> / 전체 " + DATA.length;
    var ths = document.querySelectorAll("#rtbl tr.h th");
    for (j = 0; j < ths.length; j++)
      ths[j].querySelector(".ar").innerHTML = ths[j].getAttribute("data-k") === sortKey ? (sortDir < 0 ? " ▼" : " ▲") : "";
  }

  function fillSectionSelects(){
    var keep = $("fsec").value;
    var o1 = '<option value="">섹션 전체</option>', o2 = '<option value="">섹션으로 이동…</option>';
    for (var i = 0; i < S.sections.length; i++) {
      var n = esc(S.sections[i].name);
      o1 += "<option>" + n + "</option>";
      o2 += '<option value="s' + i + '">' + n + "</option>";
    }
    $("fsec").innerHTML = o1; $("jump").innerHTML = o2;
    $("fsec").value = keep;
  }

  // ---------- 차트 ----------
  function renderCharts(){
    var bySec = {}, i, r;
    for (i = 0; i < S.rows.length; i++) { r = S.rows[i]; (bySec[r["섹션"]] = bySec[r["섹션"]] || []).push(r); }
    var v = S.meta.build_id, h = "";
    for (i = 0; i < S.sections.length; i++) {
      var name = S.sections[i].name, rows = bySec[name];
      if (!rows) continue;
      var a1 = 0, a5 = 0, a20 = 0, n1 = 0, n5 = 0, n20 = 0;
      for (var j = 0; j < rows.length; j++) {
        r = rows[j];
        if (r["1일%"] !== null) { a1 += r["1일%"]; n1++; }
        if (r["5일%"] !== null) { a5 += r["5일%"]; n5++; }
        if (r["20일%"] !== null) { a20 += r["20일%"]; n20++; }
      }
      h += '<div class="csec" id="s' + i + '"><h3>' + esc(name) + '</h3><p class="sub">평균 1일 ' + pct(n1 ? a1 / n1 : null, "%") +
           ' · 5일 ' + pct(n5 ? a5 / n5 : null, "%") + ' · 20일 ' + pct(n20 ? a20 / n20 : null, "%") + '</p><div class="grid">';
      for (j = 0; j < rows.length; j++) {
        r = rows[j];
        var flags = "";
        if (r["추세선"] === "저항선 돌파") flags += ' <span class="b up">저항선 돌파</span>';
        if (r["추세선"] === "지지선 이탈") flags += ' <span class="b dn">지지선 이탈</span>';
        if (r["거래량배수"] !== null && r["거래량배수"] >= 2) flags += ' <span class="b" style="background:rgba(217,119,6,.15);color:var(--warn)">거래량 ' + r["거래량배수"].toFixed(1) + '배</span>';
        if (r["마지막일"] && r["마지막일"] < S.meta.ref_date) flags += ' <span class="b" style="color:var(--up)">⚠ 마지막 거래 ' + esc(r["마지막일"]) + '</span>';
        h += '<div class="cell" id="c-' + esc(r["코드"]) + '"><div class="cap"><b>' + esc(r["종목"]) + '</b> <span class="c">' + esc(r["코드"]) +
             '</span> – <span class="ds">' + esc(r["설명"]) + '</span> &nbsp;' + pct(r["1일%"], "%") + flags + '</div>' +
             '<img loading="lazy" alt="' + esc(r["종목"]) + ' 차트" src="charts/' + encodeURIComponent(r["코드"]) + '.png?v=' + v + '"></div>';
      }
      h += "</div></div>";
    }
    $("chartbox").innerHTML = h;
  }

  function renderFoot(){
    var m = S.meta, h = "";
    if ((m.failed || []).length) {
      h += "<b>점검 메모 — 데이터를 받지 못한 종목</b><ul>";
      for (var i = 0; i < m.failed.length; i++) h += "<li>" + esc(m.failed[i].code) + " " + esc(m.failed[i].name) + " — " + esc(m.failed[i].error) + "</li>";
      h += "</ul>";
    }
    if ((m.mismatch || []).length) {
      h += "<b>점검 메모 — 종목명이 네이버와 다름 (사명 변경 또는 코드 확인)</b><ul>";
      for (var j = 0; j < m.mismatch.length; j++) h += "<li>" + esc(m.mismatch[j].code) + ": 리스트 '" + esc(m.mismatch[j].mine) + "' / 네이버 '" + esc(m.mismatch[j].naver) + "'</li>";
      h += "</ul>";
    }
    h += "데이터: 네이버 금융 일봉" + (m.n_yahoo ? " (일부 " + m.n_yahoo + "종목은 Yahoo Finance)" : "") +
         " · 이동평균 " + (m.ma || []).join("·") + " · 빌드 " + m.build_seconds + "초" +
         (m.repo ? ' · <a href="https://github.com/' + esc(m.repo) + '/actions" target="_blank" rel="noopener">실행 기록</a>' : "");
    $("foot").innerHTML = h;
  }

  function renderAll(){
    renderMeta(); renderSector(); fillSectionSelects(); applyFilter(); renderCharts(); renderFoot();
    $("loading").style.display = "none";
    $("sector").style.display = $("result").style.display = $("charts").style.display = $("foot").style.display = "";
    stickFilterRow(); setHeaderOffset();
  }

  // ---------- 업데이트 버튼 (GitHub Actions 실행 요청) ----------
  var memTok = "";   // 브라우저 저장소를 못 쓰는 환경(사생활 보호 모드 등)에서는 이 탭에서만 기억
  function getTok(){ try { return localStorage.getItem(TOKEN_KEY) || memTok; } catch (e) { return memTok; } }
  function setTok(t){
    memTok = t || "";
    try { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    showTokLink();
  }
  function showTokLink(){ $("tokreset").style.display = getTok() ? "" : "none"; }

  function status(text, kind, url){
    var el = $("status");
    el.className = "status on " + (kind || "run");
    $("stxt").innerHTML = esc(text) + (url ? ' <a href="' + esc(url) + '" target="_blank" rel="noopener">실행 기록</a>' : "");
  }
  function finish(text, kind, url){
    busy = false; $("upd").disabled = false;
    status(text, kind, url);
  }

  function gh(method, path, body, cb){
    var x = new XMLHttpRequest();
    x.open(method, "https://api.github.com" + path, true);
    x.setRequestHeader("Accept", "application/vnd.github+json");
    x.setRequestHeader("X-GitHub-Api-Version", "2022-11-28");
    var tok = getTok();
    if (tok) x.setRequestHeader("Authorization", "Bearer " + tok);
    if (body) x.setRequestHeader("Content-Type", "application/json");
    x.onreadystatechange = function(){ if (x.readyState === 4) cb(x.status, x.responseText); };
    x.send(body ? JSON.stringify(body) : null);
  }
  function parse(t){ try { return JSON.parse(t); } catch (e) { return null; } }

  function requestUpdate(){
    if (busy) return;
    if (!S || !S.meta.repo) { status("저장소 정보가 없습니다 (GitHub에서 한 번 실행된 뒤 사용 가능)", "err"); return; }
    if (!getTok()) {
      var t = window.prompt("GitHub 토큰을 붙여넣으세요.\n(fine-grained 토큰 · 이 저장소 · Actions: Read and write)\n이 기기의 브라우저에만 저장됩니다.");
      if (!t) return;
      setTok(t.replace(/^\s+|\s+$/g, ""));
    }
    busy = true; $("upd").disabled = true;
    status("업데이트 요청 중…", "run");
    var since = now();
    gh("POST", "/repos/" + S.meta.repo + "/actions/workflows/" + S.meta.workflow + "/dispatches", { ref: S.meta.branch || "main" }, function(st, txt){
      if (st === 200 || st === 204) {
        var j = parse(txt);
        status("요청 완료 · 실행 준비 중…", "run", j && j.html_url);
        watchRun(j && j.workflow_run_id, since);
      } else if (st === 401 || st === 403 || st === 404) {
        setTok("");
        finish("토큰이 올바르지 않거나 권한(Actions: Read and write)이 없습니다. 다시 눌러 입력하세요.", "err");
      } else if (st === 0) {
        finish("GitHub에 연결하지 못했습니다. 네트워크를 확인하세요.", "err");
      } else {
        finish("요청 실패 (HTTP " + st + ")", "err");
      }
    });
  }

  // 실행 상태 추적 → 성공하면 새 데이터가 올라올 때까지 기다렸다가 화면 갱신
  function watchRun(runId, since){
    var t0 = now(), url = null;
    function again(){
      if (now() - t0 > 25 * 60000) return finish("시간 초과 — 실행 기록을 확인하세요.", "err", url);
      setTimeout(tick, 8000);
    }
    function onRun(r){
      url = r.html_url;
      if (r.status !== "completed") {
        status((r.status === "queued" || r.status === "waiting" || r.status === "pending" ? "실행 대기 중" : "데이터 수집·차트 생성 중") +
               " · " + mmss(now() - t0) + " (보통 3~5분)", "run", url);
        return again();
      }
      if (r.conclusion === "success") return waitDeploy(url);
      finish("업데이트 실패 (" + r.conclusion + ")", "err", url);
    }
    function tick(){
      if (runId) {
        gh("GET", "/repos/" + S.meta.repo + "/actions/runs/" + runId, null, function(st, txt){
          var r = st === 200 ? parse(txt) : null;
          if (r) onRun(r); else again();
        });
      } else {
        gh("GET", "/repos/" + S.meta.repo + "/actions/workflows/" + S.meta.workflow + "/runs?per_page=5", null, function(st, txt){
          var j = st === 200 ? parse(txt) : null, runs = (j && j.workflow_runs) || [];
          for (var i = 0; i < runs.length; i++) {
            if (Date.parse(runs[i].created_at) >= since - 90000) { runId = runs[i].id; return onRun(runs[i]); }
          }
          status("실행 대기 중 · " + mmss(now() - t0), "run");
          again();
        });
      }
    }
    tick();
  }

  function waitDeploy(url){
    var oldId = S.meta.build_id, t0 = now();
    status("페이지 반영 중… (보통 1~2분)", "run", url);
    (function chk(){
      loadSummary(function(d){
        if (d && d.meta && d.meta.build_id !== oldId) {
          S = d; renderAll();
          finish("업데이트 완료 · " + d.meta.updated_at, "ok");
        } else if (now() - t0 > 8 * 60000) {
          finish("실행은 끝났지만 페이지 반영이 늦습니다. 잠시 후 새로고침하세요.", "warn", url);
        } else setTimeout(chk, 10000);
      });
    })();
  }

  // 페이지를 열었을 때 이미 실행 중인 업데이트(자동 포함)가 있으면 이어서 표시
  function resumeIfRunning(){
    if (!S || !S.meta.repo) return;
    gh("GET", "/repos/" + S.meta.repo + "/actions/workflows/" + S.meta.workflow + "/runs?per_page=1", null, function(st, txt){
      var j = st === 200 ? parse(txt) : null, r = j && j.workflow_runs && j.workflow_runs[0];
      if (r && r.status !== "completed" && now() - Date.parse(r.created_at) < 40 * 60000) {
        busy = true; $("upd").disabled = true;
        status((r.event === "schedule" ? "자동" : "수동") + " 업데이트 진행 중…", "run", r.html_url);
        watchRun(r.id, Date.parse(r.created_at));
      }
    });
  }

  // ---------- 시작 ----------
  buildTableHead();
  var ctrls = ["q", "fsec", "ftr", "noetf"];
  for (var i = 0; i < ctrls.length; i++) {
    $(ctrls[i]).addEventListener("input", applyFilter);
    $(ctrls[i]).addEventListener("change", applyFilter);
  }
  document.querySelector("#rtbl tr.f").addEventListener("input", applyFilter);
  $("freset").addEventListener("click", function(){
    var ins = document.querySelectorAll("#rtbl input.num");
    for (var j = 0; j < ins.length; j++) ins[j].value = "";
    $("q").value = ""; $("fsec").value = ""; $("ftr").value = ""; $("noetf").checked = true;
    sortKey = null; sortDir = -1; applyFilter();
  });
  $("jump").addEventListener("change", function(){
    var el = $(this.value); if (el) el.scrollIntoView(); this.value = "";
  });
  $("secttbl").addEventListener("click", function(e){
    var a = e.target;
    if (a && a.className === "secgo") {
      e.preventDefault();
      $("fsec").value = a.getAttribute("data-s"); applyFilter();
      $("result").scrollIntoView();
    }
  });
  $("upd").addEventListener("click", requestUpdate);
  $("tokreset").addEventListener("click", function(){
    if (window.confirm("이 기기에 저장된 GitHub 토큰을 지울까요? 다음 업데이트 때 다시 입력합니다.")) setTok("");
  });
  showTokLink();
  window.addEventListener("resize", function(){ stickFilterRow(); setHeaderOffset(); });
  setHeaderOffset();

  loadSummary(function(d){
    if (!d) { $("loading").innerHTML = "데이터가 아직 없습니다. GitHub Actions에서 첫 실행을 마친 뒤 새로고침하세요."; return; }
    S = d;
    renderAll();
    resumeIfRunning();
  });
})();
</script>
</body>
</html>
