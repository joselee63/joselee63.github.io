name: krx-test

# KRX 종목별 투자자 데이터 수집 테스트 — 수동 실행 전용 (매일 빌드와 별개)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: pykrx 설치
        run: pip install pykrx
      - name: 투자자별 거래대금 받기
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python tools/krx_test.py
