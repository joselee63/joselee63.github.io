name: daily-build

on:
  schedule:
    # 정기 실행은 '지금 배포된 페이지보다 새 데이터가 있는 시장'만 새로 만들어 배포 (없으면 건너뜀)
    #  → GitHub 가 실행을 몇 시간 늦게 시작하거나 데이터 반영이 늦어도 다음 실행이 이어서 반영
    - cron: "7 21 * * 1-5"          # 한국: 평일 21:07 (정각은 지연이 잦아 7분으로)
      timezone: "Asia/Seoul"
    - cron: "37 23 * * 1-5"         # 한국 보조: 21:07 실행이 밀리거나 실패했을 때
      timezone: "Asia/Seoul"
    - cron: "7 7 * * 2-6"           # 미국: 화~토 07:07 = 미국 장 마감(뉴욕 16:00) 후
      timezone: "Asia/Seoul"
    - cron: "37 11 * * 2-6"         # 미국 보조: Yahoo 반영이 늦을 때 (장 마감 몇 시간 뒤까지 전날 봉이 없기도 함)
      timezone: "Asia/Seoul"
    - cron: "17 9 * * *"            # 코인: 매일 09:17 = UTC 0시(한국 9시) 일봉 마감 직후 (주말 포함)
      timezone: "Asia/Seoul"
  workflow_dispatch:                 # 수동 실행 (Actions 탭 버튼 · 웹페이지 '업데이트' 버튼) → 세 시장 모두 항상 새로 만듦

permissions:
  contents: write                    # gh-pages 브랜치에 결과를 올리기 위해 필요

concurrency:                         # 자동·수동이 겹치면 순서대로 실행
  group: daily-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: 지금 배포된 페이지 가져오기 (새로 만들지 않은 시장은 이걸로 유지)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: gh-pages
          path: prev

      - name: 매매주체별 거래대금 가져오기 (수급 오실레이터용, investor-data 워크플로가 쌓는 data 브랜치)
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: data
          path: invdata

      - name: 종가베팅 데이터 가져오기 (closebet.yml 이 매일 만드는 릴리스 closebet-data 의 closebet.json)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download closebet-data -p closebet.json -p track.json -D cbnew
          gh release download closebet-data -p market.json -D cbnew || echo "시황판 데이터(market.json) 없음"

      - name: 배포된 기준일 읽기
        id: prev
        run: |
          ref() { [ -f "$1" ] && grep -o '"ref_date": *"[0-9-]*"' "$1" | head -1 | grep -o '[0-9-]\{10\}' || true; }
          cbref() { [ -f "$1" ] && head -c 300 "$1" | grep -o '"asof":"[0-9-]*"' | grep -o '[0-9-]\{10\}' || true; }
          echo "kr=$(ref prev/data/summary.js)" >> "$GITHUB_OUTPUT"
          echo "us=$(ref prev/us/data/summary.js)" >> "$GITHUB_OUTPUT"
          echo "coin=$(ref prev/crypto/data/summary.js)" >> "$GITHUB_OUTPUT"
          echo "cb=$(cbref prev/closebet.json)" >> "$GITHUB_OUTPUT"
          echo "cbnew=$(cbref cbnew/closebet.json)" >> "$GITHUB_OUTPUT"
          echo "배포된 기준일 — 한국 $(ref prev/data/summary.js) · 미국 $(ref prev/us/data/summary.js) · 종가베팅 $(cbref prev/closebet.json) (새 데이터 $(cbref cbnew/closebet.json))"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 한국 — 데이터 수집 · 차트 생성
        id: kr
        continue-on-error: true
        env:
          MARKET: kr
          TRIGGER: ${{ github.event_name }}
          PREV_REF: ${{ steps.prev.outputs.kr }}
          INVESTOR_DIR: invdata/investor
        run: python build_site.py

      - name: 미국 — 데이터 수집 · 차트 생성
        id: us
        continue-on-error: true
        env:
          MARKET: us
          TRIGGER: ${{ github.event_name }}
          PREV_REF: ${{ steps.prev.outputs.us }}
        run: python build_site.py

      - name: 코인 — 데이터 수집 · 차트 생성 (바이낸스 → 크라켄)
        id: coin
        continue-on-error: true
        env:
          MARKET: coin
          TRIGGER: ${{ github.event_name }}
          PREV_REF: ${{ steps.prev.outputs.coin }}
        run: python build_site.py

      - name: 새로 만들지 않은 시장(새 데이터 없음 · 실패)은 이전 페이지로 유지
        id: merge
        run: |
          built() { [ "$1" = "success" ] && [ "$2" != "true" ]; }   # 결과 · 건너뜀 여부
          KR_OK=0; US_OK=0; COIN_OK=0
          built "${{ steps.kr.outcome }}" "${{ steps.kr.outputs.skip }}" && KR_OK=1
          built "${{ steps.us.outcome }}" "${{ steps.us.outputs.skip }}" && US_OK=1
          built "${{ steps.coin.outcome }}" "${{ steps.coin.outputs.skip }}" && COIN_OK=1
          CB_PREV="${{ steps.prev.outputs.cb }}"; CB_NEW="${{ steps.prev.outputs.cbnew }}"
          CB_FRESH=0; [ -n "$CB_NEW" ] && [[ "$CB_NEW" > "$CB_PREV" ]] && CB_FRESH=1
          if [ $KR_OK = 0 ] && [ $US_OK = 0 ] && [ $COIN_OK = 0 ]; then
            if [ "${{ steps.kr.outcome }}" != "success" ] && [ "${{ steps.us.outcome }}" != "success" ] && [ "${{ steps.coin.outcome }}" != "success" ]; then echo "세 시장 모두 빌드 실패"; exit 1; fi
            if [ $CB_FRESH = 0 ]; then echo "세 시장 모두 새 데이터 없음 — 기존 페이지 유지"; echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "시장 차트는 새 데이터 없음 · 종가베팅 데이터만 새로 나옴 ($CB_PREV → $CB_NEW) → 이전 페이지에 새 closebet.json 만 바꿔 배포"
          fi
          mkdir -p site
          if [ $KR_OK = 0 ]; then
            [ -f prev/index.html ] || { echo "한국 페이지를 만들지 못했고 이전 페이지도 없음"; exit 1; }
            find site -mindepth 1 -maxdepth 1 ! -name us ! -name crypto -exec rm -rf {} +
            (cd prev && find . -mindepth 1 -maxdepth 1 ! -name us ! -name crypto ! -name .git -exec cp -r {} ../site/ \;)
            [ "${{ steps.kr.outcome }}" = "success" ] && echo "한국: 새 데이터 없음 → 이전 페이지 유지" || echo "::warning::한국 빌드 실패 → 이전 페이지 유지"
          fi
          if [ $US_OK = 0 ]; then
            rm -rf site/us
            [ -d prev/us ] && cp -r prev/us site/us
            [ "${{ steps.us.outcome }}" = "success" ] && echo "미국: 새 데이터 없음 → 이전 페이지 유지" || echo "::warning::미국 빌드 실패 → 이전 페이지 유지"
          fi
          if [ $COIN_OK = 0 ]; then
            rm -rf site/crypto
            [ -d prev/crypto ] && cp -r prev/crypto site/crypto
            [ "${{ steps.coin.outcome }}" = "success" ] && echo "코인: 새 데이터 없음 → 이전 페이지 유지" || echo "::warning::코인 빌드 실패 → 이전 페이지 유지"
          fi
          # 종가베팅: 릴리스의 최신 closebet.json 이 사이트에 있는 것보다 새것이면 교체 (main 의 web/closebet.json 은 연구 시점 스냅숏)
          SITE_CB=$(head -c 300 site/closebet.json 2>/dev/null | grep -o '"asof":"[0-9-]*"' | grep -o '[0-9-]\{10\}' || true)
          if [ -n "$CB_NEW" ] && ! [[ "$CB_NEW" < "$SITE_CB" ]]; then
            cp cbnew/closebet.json site/closebet.json; echo "종가베팅 데이터 $CB_NEW 반영"
          else
            echo "::warning::종가베팅 새 데이터 없음 → 사이트의 closebet.json(${SITE_CB:-없음}) 유지"
          fi
          [ -f cbnew/track.json ] && cp cbnew/track.json site/track.json && echo "실전 추적 기록 반영"
          [ -f cbnew/market.json ] && cp cbnew/market.json site/market.json && echo "시황판 데이터 반영"
          [ -f prev/news.json ] && [ ! -f site/news.json ] && cp prev/news.json site/news.json && echo "시황판 뉴스 유지 (news.yml 이 따로 갱신)"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: gh-pages 브랜치에 배포
        if: steps.merge.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_DATE: "kr ${{ steps.kr.outputs.ref_date }} · us ${{ steps.us.outputs.ref_date }} · coin ${{ steps.coin.outputs.ref_date }} · cb ${{ steps.prev.outputs.cbnew }}"
        run: |
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "update ${REF_DATE} (${{ github.event_name }})"
          # 매번 기록 없이 덮어써서 저장소 용량이 쌓이지 않게 함
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
