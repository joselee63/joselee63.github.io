name: flow
# 시장 수급(supply-market.html) 데이터만 사이트에 바로 반영 — 전체 빌드(daily.yml)를 기다리지 않음
#   내 PC 의 tools/market/flow_kiwoom.py(종베 레이더가 거래일 20:12 에 실행)가 키움 '통합(KRX+NXT)' 값을 받아
#   릴리스 flow-data 에 market.json 을 덮어쓰고 이 워크플로를 시작한다 → gh-pages 의 flow/ 만 교체
#   (daily.yml 전체 빌드 때도 같은 릴리스에서 받아 넣으므로 사라지지 않음)
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flow-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 릴리스 flow-data 받기
        run: |
          gh release download flow-data -p market.json -D fw -R "$GITHUB_REPOSITORY"
          python3 -c "import json; d=json.load(open('fw/market.json')); print('시장 수급', len(d['d']), '거래일 · 기준일', d['asof'], '·', d['built'])"

      - name: gh-pages 에 flow/ 만 반영
        run: |
          for i in 1 2 3; do
            rm -rf pages
            git clone -q --depth 1 --filter=blob:none --sparse -b gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages
            git -C pages sparse-checkout set flow
            mkdir -p pages/flow && cp fw/market.json pages/flow/
            cd pages
            git add -A flow
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "flow $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            if git push -q origin gh-pages; then echo "시장 수급 데이터 반영 완료"; exit 0; fi
            cd ..
            echo "push 실패(전체 빌드와 겹침?) — ${i}번째 재시도"; sleep 15
          done
          exit 1
