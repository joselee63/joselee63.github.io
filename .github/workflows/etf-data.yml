name: etf-data

# 업종·테마 ETF 월별 목록 · 일봉 · 구성종목(분기 스냅샷) → data 브랜치 etf/ (신고가 섹터 ETF판 백테스트용)
# 구성종목은 오래 걸림(수 시간) → 시간 한도에 걸리면 받은 분기까지 저장하고, 다시 돌리면 이어받음
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all|list|ohlcv|pdf|probe|verify"
        required: false
        default: "all"

permissions:
  contents: write

concurrency:
  group: etf-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install pandas pykrx lxml

      - name: data 브랜치 가져오기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 -b data "$URL" datadir

      - name: ETF 데이터 수집
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          PYTHONUNBUFFERED: "1"
        run: python tools/etf_data.py datadir "${{ github.event.inputs.mode || 'all' }}"

      - name: data 브랜치에 저장 (중간 실패해도 받은 만큼 저장)
        if: always()
        run: |
          cd datadir
          [ -d etf ] || { echo "저장할 데이터 없음"; exit 0; }
          git add -A etf
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "etf $(TZ=Asia/Seoul date +%Y-%m-%d) (${{ github.event.inputs.mode || 'all' }})"
          git push -q origin data
