<style>
:root{
  --bg:#f4f5f7; --fg:#1d2127; --muted:#6b7280; --line:#e2e5ea; --soft:#f1f3f5; --card:#ffffff;
  --accent:#1f2937; --accent-fg:#ffffff; --hoverline:#c5cbd4;
  --am:#f59e0b; --pm:#6366f1; --sel:#1f2937; --sel-fg:#fff; --today:#E5383B;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1114; --fg:#e7e9ec; --muted:#9aa1ab; --line:#2a2f36; --soft:#1c1f24; --card:#171a1e;
         --accent:#e7e9ec; --accent-fg:#121417; --hoverline:#4a515c; --sel:#e7e9ec; --sel-fg:#121417;
         --am:#fbbf24; --pm:#818cf8; --today:#ff5a5f; --shadow:none; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:14px;line-height:1.45}
a{color:inherit}
button{font-family:inherit}

/* ---------- 상단 바 · 탭 (메인 페이지와 같은 모양) ---------- */
header{background:var(--card);border-bottom:1px solid var(--line)}
.top{max-width:1840px;margin:0 auto;padding:11px 18px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.top h1{font-size:18px;margin:0;letter-spacing:-.2px}
.top h1 a{text-decoration:none}
@media (hover:hover){ .top h1 a:hover{opacity:.7} }
.top .meta{color:var(--muted);font-size:12.5px}
.tabs{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(16,24,40,.04)}
.tabs .in{max-width:1840px;margin:0 auto;padding:8px 18px;display:flex;gap:8px}
.tab{font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--muted);text-decoration:none;
  box-shadow:0 1px 1px rgba(16,24,40,.05);transition:background .15s,color .15s,border-color .15s}
@media (hover:hover){ .tab:not(.on):hover{color:var(--fg);border-color:var(--hoverline);background:var(--soft)} }
.tab svg{width:15px;height:15px;flex:none}
.tab.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tab.game{margin-left:auto}
@media (max-width:1000px){
  .tabs .in{padding:7px 10px;gap:6px}
  .tab{flex:1;padding:8px 4px;font-size:13px;gap:5px;white-space:nowrap}
  .tab.game{margin-left:0}
  .top .meta{display:none}
}
@media (max-width:520px){ .tab svg,.tab .sl{display:none} }
/* ---------- 디자인 (Apple 사이트풍: 블랙·화이트·그레이 · 둥근 카드 · 알약 탭) ---------- */
:root{
  --bg:#fbfbfd; --fg:#1d1d1f; --muted:#6e6e73; --line:rgba(0,0,0,.07); --soft:#f2f2f4; --card:#ffffff; --band:#f5f5f7;
  --head:#f5f5f7; --zebra:#fafafb; --hover:#eef3fb; --hoverline:#d2d2d7; --accent:#1d1d1f; --accent-fg:#ffffff;
  --bar:rgba(251,251,253,.82); --pill-hover:rgba(0,0,0,.05); --pill-on:#1d1d1f; --pill-on-fg:#ffffff;
  --hd-bg:#333336; --hd-fg:#f5f5f7; --hd-mu:rgba(245,245,247,.62); --hd-tag:rgba(255,255,255,.14); --hd-btn:#f5f5f7; --hd-btn-fg:#1d1d1f;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 4px 14px rgba(0,0,0,.04);                  /* 작은 카드 (차트 타일) */
  --card-shadow:0 1px 3px rgba(0,0,0,.06),0 10px 32px rgba(0,0,0,.08);            /* 구역 카드 — 배경과 확실히 구분 */
  --lift:0 14px 34px rgba(0,0,0,.11),0 3px 8px rgba(0,0,0,.05);                   /* 마우스 올렸을 때 떠오름 */
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --fg:#f5f5f7; --muted:#98989d; --line:rgba(255,255,255,.09); --soft:#2c2c2e; --card:#1c1c1e; --band:#232325;
         --head:#2c2c2e; --zebra:#202022; --hover:#26292f; --hoverline:#48484a; --accent:#f5f5f7; --accent-fg:#1d1d1f;
         --bar:rgba(0,0,0,.72); --pill-hover:rgba(255,255,255,.08); --pill-on:#f5f5f7; --pill-on-fg:#1d1d1f; --hd-bg:#2c2c2e;
         --shadow:none; --card-shadow:0 0 0 1px rgba(255,255,255,.05),0 10px 32px rgba(0,0,0,.55);
         --lift:0 14px 34px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08); }
}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
header{background:var(--hd-bg);color:var(--hd-fg);border-bottom:0}
.top{padding:14px 22px}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.4px}
header .meta,header .top .meta{color:var(--hd-mu)}
header .meta b{color:var(--hd-fg)}
header .tag{background:var(--hd-tag);border-color:transparent;color:var(--hd-fg)}
header .btn{background:var(--hd-btn);color:var(--hd-btn-fg);border-radius:980px;padding:7px 16px}
header .lnk,header .status{color:var(--hd-mu)}
.tabs{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);box-shadow:none}
.tabs .in{padding:8px 22px;gap:4px}
.tab{border:0;background:transparent;box-shadow:none;border-radius:980px;padding:7px 15px;color:var(--muted)}
@media (hover:hover){ .tab:not(.on):hover{background:var(--pill-hover);color:var(--fg);border-color:transparent} }
.tab.on{background:var(--pill-on);color:var(--pill-on-fg);box-shadow:none}
.tab .n{background:var(--pill-hover);color:var(--muted)}
.tab.on .n{background:rgba(127,127,127,.28);color:inherit}
.tab.game{box-shadow:inset 0 0 0 1px var(--line)}
.tab.game.on{box-shadow:none}
.card{border-radius:18px;border:1px solid var(--line);box-shadow:var(--card-shadow)}
.btn,.reset{border-radius:980px}
.act{border-radius:12px}
.rb{border-radius:980px}
.res{border-radius:20px}
.ev .item{border-radius:12px}
@media (max-width:1000px){ .tabs .in{padding:7px 10px} }
/* 국기 · 한국/미국 전환 (오른쪽 위) */
.flag{display:block;width:24px;height:16px;border-radius:3px;box-shadow:0 0 0 .5px rgba(0,0,0,.25);flex:none}
.top h1 a{display:inline-flex;align-items:center;gap:10px}
.mkt{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.1);margin-left:4px}
.mkt a{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:999px;color:var(--hd-mu);
  text-decoration:none;font-size:12.5px;font-weight:600;transition:background .15s,color .15s}
.mkt a .flag{width:18px;height:12px;border-radius:2px}
@media (hover:hover){ .mkt a:not(.on):hover{color:var(--hd-fg);background:rgba(255,255,255,.08)} }
.mkt a.on{background:rgba(255,255,255,.94);color:#1d1d1f}
.top .mkt{margin-left:auto}
/* 오른쪽 탭 묶음: 유사 차트 · 차트 게임 (별도 페이지) */
.tab.sim{margin-left:auto;text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.tab.sim + .tab.game{margin-left:0}
.tab.sim.on{box-shadow:none}
@media (max-width:1000px){ .tab.sim{margin-left:0} }
/* ---------- 유사 차트 찾기 ---------- */
.swrap{max-width:1840px;margin:0 auto;padding:18px 18px 60px;display:flex;flex-direction:column;gap:18px}
.tab.scr{margin-left:auto;text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.tab.scr + .tab.sim{margin-left:0}
.tab.scr.on{box-shadow:none}
@media (max-width:1000px){ .tab.scr{margin-left:0} }
/* 휴대폰: 탭이 많아 한 줄에 안 들어가면 옆으로 밀어서 보기 */
@media (max-width:1000px){
  .tabs .in{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs .in::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:8px 12px}
}
/* ---------- 종목 검색 ---------- */
.kwrap{max-width:1840px;margin:0 auto;padding:18px 18px 60px;display:flex;flex-direction:column;gap:18px}
.tab.qnt{text-decoration:none;box-shadow:inset 0 0 0 1px var(--line)}
.tab.qnt.on{box-shadow:none}
/* Daily briefing 탭 */
.tab.brf{text-decoration:none}

/* ---------- 레이아웃 ---------- */
.bwrap{max-width:1400px;margin:0 auto;padding:18px 18px 60px;display:grid;grid-template-columns:320px minmax(0,1fr);gap:18px;align-items:start}
.card{background:var(--card)}
.side{position:sticky;top:64px;display:flex;flex-direction:column;gap:12px}

/* 달력 */
.cal{padding:14px 14px 12px}
.cal .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal .ym{font-size:16px;font-weight:700;letter-spacing:-.2px}
.cal .nav{display:flex;gap:4px}
.cal .nav button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;font-size:14px}
@media (hover:hover){ .cal .nav button:hover{background:var(--soft)} }
.cal .nav button:disabled{opacity:.35;cursor:default}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11.5px;color:var(--muted);text-align:center;font-weight:600;padding:2px 0 4px}
.dow.sun{color:var(--today)} .dow.sat{color:#3b82f6}
.day{position:relative;aspect-ratio:1/1;border-radius:10px;border:1px solid transparent;background:none;color:var(--fg);
  font:inherit;font-size:13.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0}
.day.empty{visibility:hidden}
.day.off{color:var(--muted);opacity:.45;font-weight:500}
.day.has{cursor:pointer;background:var(--soft)}
@media (hover:hover){ .day.has:hover{border-color:var(--hoverline)} }
.day.today{box-shadow:inset 0 0 0 1.5px var(--today)}
.day.sel{background:var(--sel);color:var(--sel-fg)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%;display:block}
.dots i.am{background:var(--am)} .dots i.pm{background:var(--pm)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;padding:0 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}

/* 최근 목록 */
.recent{padding:12px 14px}
.recent h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:700}
.recent a{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;text-decoration:none;font-size:13.5px;font-weight:600}
.recent a.on{background:var(--soft)}
@media (hover:hover){ .recent a:hover{background:var(--soft)} }
.recent a small{margin-left:auto;color:var(--muted);font-weight:500;font-size:12px}

/* 본문 */
.main{min-width:0}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:12px}
.bar .dt{font-size:16px;font-weight:700;margin-right:auto;letter-spacing:-.2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border:0;background:var(--card);color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
.seg button:disabled{opacity:.35;cursor:default}
.bar .open{font-size:12.5px;color:var(--muted);text-decoration:none;padding:6px 8px;border-radius:7px}
@media (hover:hover){ .bar .open:hover{background:var(--soft);color:var(--fg)} }
.frame{overflow:hidden;border-radius:14px}
iframe{display:block;width:100%;border:0;min-height:70vh;background:transparent}
.msg{padding:60px 20px;text-align:center;color:var(--muted)}

@media (max-width:900px){
  .bwrap{grid-template-columns:1fr;padding:12px 12px 48px;gap:12px}
  .side{position:static}
  .recent{display:none}
}
</style>

<div class="bwrap">
  <aside class="side">
    <section class="card cal" aria-label="브리핑 달력">
      <div class="hd">
        <div class="ym" id="ym">—</div>
        <div class="nav">
          <button type="button" id="prev" aria-label="이전 달">‹</button>
          <button type="button" id="next" aria-label="다음 달">›</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend">
        <span><i style="background:var(--am)"></i>☀️ 모닝</span>
        <span><i style="background:var(--pm)"></i>🌙 마감</span>
      </div>
    </section>
    <section class="card recent">
      <h3>최근 브리핑</h3>
      <div id="recent"></div>
    </section>
  </aside>

  <main class="main">
    <div class="card bar">
      <div class="dt" id="dt">—</div>
      <div class="seg" role="tablist">
        <button type="button" id="b-am" data-k="morning">☀️ 모닝</button>
        <button type="button" id="b-pm" data-k="close">🌙 마감</button>
      </div>
      <a class="open" id="open" href="#" target="_blank" rel="noopener">새 창 ↗</a>
    </div>
    <div class="card frame"><iframe id="fr" title="브리핑 리포트"></iframe><div class="msg" id="msg">브리핑을 불러오는 중…</div></div>
  </main>
</div>

<script>
(function(){
  var DOW = ["일","월","화","수","목","금","토"], KN = {morning:"☀️ 모닝브리핑", close:"🌙 마감브리핑"};
  var byDate = {}, dates = [], cur = null, view = null;
  var $ = function(id){ return document.getElementById(id); };
  var fr = $("fr"), msg = $("msg");

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function ymd(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function today(){ var n = new Date(Date.now() + (n0() + 540) * 60000); return ymd(n); }
  function n0(){ return new Date().getTimezoneOffset(); }        // 한국 시간 기준 '오늘'
  function label(s){ var p = s.split("-"), d = new Date(+p[0], p[1] - 1, +p[2]);
    return p[0] + "년 " + (+p[1]) + "월 " + (+p[2]) + "일 (" + DOW[d.getDay()] + ")"; }

  function drawCal(){
    var y = view.y, m = view.m, first = new Date(y, m, 1), last = new Date(y, m + 1, 0).getDate();
    $("ym").textContent = y + "년 " + (m + 1) + "월";
    var g = $("grid"), h = "";
    DOW.forEach(function(d, i){ h += '<div class="dow' + (i === 0 ? " sun" : i === 6 ? " sat" : "") + '">' + d + "</div>"; });
    for (var i = 0; i < first.getDay(); i++) h += '<div class="day empty"></div>';
    var td = today();
    for (var d = 1; d <= last; d++){
      var key = y + "-" + pad(m + 1) + "-" + pad(d), it = byDate[key], cls = "day";
      cls += it ? " has" : " off";
      if (key === td) cls += " today";
      if (cur && key === cur.date) cls += " sel";
      var dots = it ? '<span class="dots">' + (it.morning ? '<i class="am"></i>' : "") + (it.close ? '<i class="pm"></i>' : "") + "</span>" : '<span class="dots"></span>';
      h += it ? '<button type="button" class="' + cls + '" data-d="' + key + '" aria-label="' + label(key) + ' 브리핑">' + d + dots + "</button>"
              : '<div class="' + cls + '">' + d + dots + "</div>";
    }
    g.innerHTML = h;
    var minYM = dates.length ? dates[dates.length - 1].slice(0, 7) : null, maxYM = dates.length ? dates[0].slice(0, 7) : null;
    var ym = y + "-" + pad(m + 1);
    $("prev").disabled = !minYM || ym <= minYM;
    $("next").disabled = !maxYM || ym >= maxYM;
  }

  function drawRecent(){
    var h = "", n = 0;
    for (var i = 0; i < dates.length && n < 10; i++){
      var it = byDate[dates[i]];
      ["close", "morning"].forEach(function(k){
        if (it[k] && n < 10){
          var on = cur && cur.date === dates[i] && cur.kind === k;
          h += '<a href="#' + dates[i] + "/" + k + '"' + (on ? ' class="on"' : "") + ">" + (k === "morning" ? "☀️" : "🌙") + " " +
               dates[i].slice(5).replace("-", "/") + " " + (k === "morning" ? "모닝" : "마감") + "<small>" + DOW[new Date(dates[i]).getDay()] + "</small></a>";
          n++;
        }
      });
    }
    $("recent").innerHTML = h || '<div style="color:var(--muted);font-size:13px">아직 브리핑이 없습니다.</div>';
  }

  function show(date, kind){
    var it = byDate[date];
    if (!it) return;
    if (!it[kind]) kind = it.close ? "close" : "morning";
    cur = {date: date, kind: kind};
    var p = date.split("-"); view = {y: +p[0], m: p[1] - 1};
    $("dt").textContent = label(date);
    $("b-am").disabled = !it.morning; $("b-pm").disabled = !it.close;
    $("b-am").classList.toggle("on", kind === "morning"); $("b-pm").classList.toggle("on", kind === "close");
    var src = "briefing/" + it[kind] + "?v=" + (it.v || "");
    $("open").href = src;
    msg.style.display = "block"; msg.textContent = "불러오는 중…";
    fr.src = src;
    document.title = KN[kind] + " " + date + " · Daily briefing";
    var h = "#" + date + "/" + kind;
    if (location.hash !== h) history.replaceState(null, "", h);
    drawCal(); drawRecent();
  }

  // iframe 높이를 내용에 맞춤 (같은 사이트 파일이라 접근 가능)
  var ro = null;
  fr.addEventListener("load", function(){
    msg.style.display = "none";
    try {
      var doc = fr.contentDocument, fit = function(){ fr.style.height = doc.documentElement.scrollHeight + "px"; };
      fit();
      if (ro) ro.disconnect();
      if (window.ResizeObserver){ ro = new ResizeObserver(fit); ro.observe(doc.body); }
      doc.querySelectorAll("a[href]").forEach(function(a){
        var h = a.getAttribute("href");
        if (/^#/.test(h)) {                                // 리포트 안 목차 → 바깥 페이지를 그 위치로 스크롤
          a.addEventListener("click", function(e){
            var t = doc.getElementById(h.slice(1)); if (!t) return;
            e.preventDefault();
            window.scrollTo({top: fr.getBoundingClientRect().top + window.scrollY + t.getBoundingClientRect().top - 64, behavior: "smooth"});
          });
        } else a.target = "_blank";
      });
    } catch (e) { fr.style.height = "80vh"; }
  });

  function fromHash(){
    var m = /^#(\d{4}-\d{2}-\d{2})(?:\/(morning|close))?$/.exec(location.hash);
    if (m && byDate[m[1]]) { show(m[1], m[2] || "close"); return true; }
    return false;
  }

  $("grid").addEventListener("click", function(e){
    var b = e.target.closest("button.day"); if (!b) return;
    var it = byDate[b.dataset.d];
    // 같은 날을 다시 누르면 유지, 새 날이면 지금 보던 종류(모닝/마감) 우선
    show(b.dataset.d, cur && it[cur.kind] ? cur.kind : (it.close ? "close" : "morning"));
  });
  $("b-am").onclick = function(){ cur && show(cur.date, "morning"); };
  $("b-pm").onclick = function(){ cur && show(cur.date, "close"); };
  $("prev").onclick = function(){ view.m--; if (view.m < 0){ view.m = 11; view.y--; } drawCal(); };
  $("next").onclick = function(){ view.m++; if (view.m > 11){ view.m = 0; view.y++; } drawCal(); };
  window.addEventListener("hashchange", fromHash);

  fetch("briefing/list.json?t=" + Date.now()).then(function(r){ return r.json(); }).then(function(list){
    list.forEach(function(x){ (byDate[x.date] = byDate[x.date] || {})[x.kind] = x.file; byDate[x.date].v = x.v; });
    dates = Object.keys(byDate).sort().reverse();
    if (!dates.length){ msg.textContent = "아직 올라온 브리핑이 없습니다."; var t = new Date(); view = {y: t.getFullYear(), m: t.getMonth()}; drawCal(); drawRecent(); return; }
    if (!fromHash()){ var it = byDate[dates[0]]; show(dates[0], it.close ? "close" : "morning"); }
  }).catch(function(){ msg.textContent = "브리핑 목록을 불러오지 못했습니다."; });
})();
</script>
